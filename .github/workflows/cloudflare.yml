name: Deploy PrashantVerse to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test lib/browser-session.test.ts
      - run: npx tsc --noEmit
      - run: npm run build:cloudflare
      - name: Deploy to Cloudflare
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: d429fec72f2ff89ee52b668197ec7d73
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
